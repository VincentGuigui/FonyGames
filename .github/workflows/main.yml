name: 🚀 Deploy website on push

on:
  push:
    branches:
      - dev
      - prod
  workflow_dispatch:

# One deploy at a time per branch. Never cancel in flight: an interrupted FTP
# sync leaves the site half-uploaded.
concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  web-deploy:
    name: 🎉 Deploy
    runs-on: ubuntu-latest
    # Guard for manual runs: workflow_dispatch from any other branch would name
    # a non-existent environment and silently get empty secrets.
    if: github.ref_name == 'dev' || github.ref_name == 'prod'
    # Branch name == environment name, so `dev` and `prod` each pull their own
    # secrets. Without this key, environment secrets resolve to "".
    environment: ${{ github.ref_name }}

    # A THROWAWAY MariaDB for the tests, and nothing else — it is never the deploy
    # target, which is the host's own database reachable only from PHP
    # (docs/database.md §3).
    #
    # It exists because docs/database.md §4 rule 3 makes MariaDB the test target: the
    # shipped DDL is MariaDB, and `api/tests/schema.php` builds the test schema from the
    # real `db/init.sql`. That file used to be hand-translated to SQLite, so a
    # MariaDB-only DDL error passed CI and failed on the host. There is deliberately no
    # SQLite fallback, so without this service the tests cannot run at all — which is the
    # point: a suite that skips silently proves nothing.
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: ci
        ports:
          - 3306:3306
        # Without a health check the tests start before the server accepts connections,
        # which reads as "no MariaDB reachable" on a cold runner.
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12

    steps:
    # Shallow is fine: the deployer's `delta` mode would need full history, but
    # delta diffs git and we deploy build output, so we stay on `full` sync.
    - name: 🚚 Get latest code
      uses: actions/checkout@v6

    - name: 🔐 Check deployment secrets
      env:
        FTPHOST: ${{ secrets.FTPHOST }}
        FTPUSER: ${{ secrets.FTPUSER }}
        FTPPWD: ${{ secrets.FTPPWD }}
        ADMIN_PATH: ${{ secrets.ADMIN_PATH }}
        ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
        ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        DB_DSN: ${{ secrets.DB_DSN }}
        DB_USER: ${{ secrets.DB_USER }}
        DB_PASS: ${{ secrets.DB_PASS }}
      run: |
        missing=""
        [ -n "$FTPHOST" ] || missing="$missing FTPHOST"
        [ -n "$FTPUSER" ] || missing="$missing FTPUSER"
        [ -n "$FTPPWD" ]  || missing="$missing FTPPWD"

        # The admin centre's secrets are required only once the page exists in the
        # tree. Gating on the directory rather than on a hand-flipped flag means this
        # starts enforcing itself the moment the feature lands, and cannot be forgotten
        # — and it does not break today's deploys before the secrets have been set.
        #
        # MAIL_SECRET used to be in this list. It no longer exists: the admin centre
        # moved to PHP, so the code that mints a magic link calls mail() directly and
        # there is no Worker->PHP hop to authenticate (docs/specs/backoffice.md §5).
        if [ -d www/ops-placeholder ]; then
          [ -n "$ADMIN_PATH" ]  || missing="$missing ADMIN_PATH"
          [ -n "$ADMIN_EMAIL" ] || missing="$missing ADMIN_EMAIL"
          [ -n "$ADMIN_TOKEN" ] || missing="$missing ADMIN_TOKEN"
          [ -n "$DB_DSN" ]      || missing="$missing DB_DSN"
          [ -n "$DB_USER" ]     || missing="$missing DB_USER"
          [ -n "$DB_PASS" ]     || missing="$missing DB_PASS"
        elif [ -z "$ADMIN_PATH" ] || [ -z "$ADMIN_EMAIL" ] || [ -z "$ADMIN_TOKEN" ]; then
          echo "::notice::ADMIN_PATH / ADMIN_EMAIL / ADMIN_TOKEN not set yet. Not required"\
               "until the admin page is in the tree, and then required automatically."
        fi

        if [ -n "$missing" ]; then
          echo "::error::Missing secret(s) in environment '${{ github.ref_name }}':$missing"
          exit 1
        fi

        # A bad ADMIN_PATH would put the admin page somewhere unintended, or break the
        # rename outright. Checked here because the value is only ever seen by CI.
        if [ -n "$ADMIN_PATH" ]; then
          case "$ADMIN_PATH" in
            */*|*\ *|.*)
              echo "::error::ADMIN_PATH must be a single directory name — no slashes,"\
                   "no spaces, no leading dot."
              exit 1
              ;;
          esac
        fi

        # What this step CANNOT check, stated so nobody trusts it further than it goes:
        # whether mail() actually delivers. An address being present is not
        # deliverability, and shared-host mail can be accepted and then dropped by the
        # recipient's filter. ADMIN_TOKEN is the break-glass for exactly that
        # (docs/specs/backoffice.md §5).
        #
        # It also cannot check that ADMIN_EMAIL is an address the operator can read.
        # A typo here means a link nobody receives, and it looks identical to spam.

    - name: 🟢 Set up Node
      uses: actions/setup-node@v6
      with:
        node-version: 22
        cache: npm

    - name: 📦 Install
      run: npm ci

    # `npm test` now includes the PHP suite (docs/testing.md §1.1a), so prove the
    # binary is there and say which version, rather than letting the failure show up
    # as an opaque `php: not found` inside an npm script.
    #
    # No `shivammathur/setup-php`: `ubuntu-latest` ships a PHP CLI already, and the
    # suite is plain PHP 8.1 syntax with no extensions beyond the defaults. A
    # third-party action for something already installed is a dependency and a
    # supply-chain surface for nothing.
    - name: 🐘 PHP available
      run: php --version

    # The logic harness, before the build. It is the only thing that checks the
    # referees, the board physics, the card import rules and the backoffice's auth
    # rules, and it costs seconds — leaving it out meant a guard that only ever ran
    # on someone's laptop.
    - name: 🧪 Test
      env:
        # The service container, over TCP. Named `_test` because the suite REFUSES to run
        # against a database whose name does not end that way — it truncates every table
        # it knows about, and that guard is the one mistake here that would destroy data.
        FONY_TEST_DSN: mysql:host=127.0.0.1;port=3306;dbname=fonygames_test;charset=utf8mb4
        FONY_TEST_USER: root
        FONY_TEST_PASS: ci
      run: npm test

    # Typechecks first (`npm run build` runs tsc --noEmit), so a type error
    # fails the deploy instead of shipping. It also stages api/ into dist/api,
    # so one build produces one uploadable tree (docs/deployment.md §5).
    - name: 🔨 Build
      run: npm run build

    # The admin centre: give it its real path, and its config.
    #
    # THE REPOSITORY IS PUBLIC, so the path cannot be committed — the build emits
    # `ops-placeholder/` and this step renames it to the ADMIN_PATH secret
    # (docs/deployment.md §3.4). Skipped entirely when the secrets are absent, which is
    # what lets the site keep deploying before the admin is configured; the pre-flight
    # above is what makes them required once the page is in the tree.
    - name: 🔒 Place the admin centre
      env:
        ADMIN_PATH: ${{ secrets.ADMIN_PATH }}
        ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
        ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        DB_DSN: ${{ secrets.DB_DSN }}
        DB_USER: ${{ secrets.DB_USER }}
        DB_PASS: ${{ secrets.DB_PASS }}
        CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        CF_ANALYTICS_TOKEN: ${{ secrets.CF_ANALYTICS_TOKEN }}
        MAIL_FROM: ${{ secrets.MAIL_FROM }}
      run: |
        # Masked FIRST, before the value is used anywhere: ::add-mask:: only redacts
        # lines written after it, so masking at the end of the step would leave every
        # earlier `set -x` line and error message carrying the real path.
        [ -n "$ADMIN_PATH" ] && echo "::add-mask::$ADMIN_PATH"

        if [ -z "$ADMIN_PATH" ]; then
          echo "::notice::ADMIN_PATH not set — removing the admin placeholder rather than"\
               "publishing it under a guessable name."
          rm -rf dist/ops-placeholder dist/api
          exit 0
        fi

        # Refuse rather than overwrite. `mv` onto an existing directory would nest it,
        # and the deploy would then publish the admin one level deeper than the link
        # points — a broken admin that looks like a wrong ADMIN_PATH.
        if [ -e "dist/$ADMIN_PATH" ]; then
          echo "::error::dist/$ADMIN_PATH already exists; ADMIN_PATH collides with a real route."
          exit 1
        fi
        mv dist/ops-placeholder "dist/$ADMIN_PATH"
        cp api/htaccess-admin "dist/$ADMIN_PATH/.htaccess"

        # The origin the magic link points at. From the branch, NOT from
        # $_SERVER['HTTP_HOST'] at runtime: a poisoned Host header would otherwise mail
        # the operator a link to somebody else's site carrying a valid token.
        if [ "${{ github.ref_name }}" = "prod" ]; then
          SITE_ORIGIN="https://fonygames.guigui.fr"
          SHOW_ALL="false"
        else
          SITE_ORIGIN="https://fonygames-dev.guigui.fr"
          # dev shows every game with a badge stating what prod would do, so it is a
          # preview of the catalogue rather than a copy of prod's restrictions
          # (docs/specs/backoffice.md §2b).
          SHOW_ALL="true"
        fi

        # A command group redirected once, with each value escaped for a PHP
        # single-quoted string: a backslash becomes two, then a quote becomes \'. Order
        # matters — escaping quotes first would then double the backslash it added.
        # Verified against values containing both.
        {
          echo "<?php"
          echo "// Generated by the deploy. Not committed — this repository is public."
          echo "return ["
          for pair in \
            "db_dsn:$DB_DSN" "db_user:$DB_USER" "db_pass:$DB_PASS" \
            "admin_email:$ADMIN_EMAIL" "admin_token:$ADMIN_TOKEN" \
            "admin_path:$ADMIN_PATH" "site_origin:$SITE_ORIGIN" \
            "cf_account_id:$CF_ACCOUNT_ID" "cf_analytics_token:$CF_ANALYTICS_TOKEN" \
            "mail_from:${MAIL_FROM:-noreply@guigui.fr}"
          do
            key="${pair%%:*}"
            value="${pair#*:}"
            printf "  '%s' => '%s',\n" "$key" "$(printf '%s' "$value" | sed "s/\\\\/\\\\\\\\/g; s/'/\\\\'/g")"
          done
          # A boolean, so it is written unquoted rather than through the string loop.
          echo "  'show_all' => $SHOW_ALL,"
          echo "];"
        } > dist/api/config.php

        # Never in the log, and never readable by another account on a shared host.
        chmod 600 dist/api/config.php
        echo "Admin staged. config.php written with $(grep -c '=>' dist/api/config.php) keys."

    # SFTP over SSH on port 22, with username + password. The host's port 21
    # answers FTP but rejects AUTH TLS ("500 'AUTH': command unrecognized"), so
    # explicit FTPS is not available and this is the only encrypted option.
    - name: 📂 Sync files
      uses: milanmk/actions-file-deployer@1.18
      with:
        remote-protocol: sftp
        remote-host: ${{ secrets.FTPHOST }}
        remote-port: 22
        remote-user: ${{ secrets.FTPUSER }}
        remote-password: ${{ secrets.FTPPWD }}
        # The BUILD OUTPUT ships, not the source: www/ is source (TSX, CSS),
        # dist/ is what a browser can actually run. The action runs
        # `lftp mirror --reverse <local-path> <remote-path>`, so the contents
        # of dist/ land directly in /www.
        local-path: dist
        remote-path: /www
        # `full` uploads everything and deletes nothing — the action's own
        # recommendation while the site is small. Switch to `delta` later;
        # note delta diffs git, so it cannot see build output and would need
        # dist/ committed. Staying on `full` is the correct choice here.
        sync: full

    # Can this host run the API at all? Asked BEFORE anything depends on the answer.
    #
    # `api/index.php` and `api/lib/` need PHP 8.1 (`reply(): never`, App's `readonly`
    # promoted property). On an older interpreter they are a PARSE error, which no handler
    # inside them can catch, and with display_errors off — the shared-hosting norm — every
    # endpoint answers 500 with an empty body. That is precisely how this endpoint's first
    # deploy failed, with nothing in the log to act on.
    #
    # `api/preflight.php` is written in pre-7 syntax so it parses on the interpreter that
    # cannot parse the rest (docs/deployment.md §3.6c). It also counts the .sql files that
    # actually landed, which the runner cannot otherwise see: SFTP hands back no manifest,
    # so "db/ uploaded" and "db/ silently skipped" look identical from here.
    - name: 🐘 Host PHP check
      env:
        ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
      run: |
        if [ -z "$ADMIN_TOKEN" ]; then
          echo "::notice::ADMIN_TOKEN not set — skipping the host PHP check."
          exit 0
        fi

        if [ "${{ github.ref_name }}" = "prod" ]; then
          ORIGIN="https://fonygames.guigui.fr"
        else
          ORIGIN="https://fonygames-dev.guigui.fr"
        fi

        # BOTH headers, every time. Apache eats `Authorization` behind a CGI/FastCGI/FPM
        # handler unless CGIPassAuth is on, so on a shared host it can simply never reach
        # PHP — which is indistinguishable from a wrong token, and is what the first run of
        # this step actually hit. `X-Admin-Token` needs no server cooperation. The API
        # prefers the standard header when it is there.
        BODY=$(curl -sS \
          -H "Authorization: Bearer $ADMIN_TOKEN" \
          -H "X-Admin-Token: $ADMIN_TOKEN" \
          -w '\n%{http_code}' \
          "$ORIGIN/api/preflight.php") || {
            echo "::error::Could not reach $ORIGIN/api/preflight.php."
            exit 1
          }

        STATUS=$(printf '%s' "$BODY" | tail -n1)
        JSON=$(printf '%s' "$BODY" | sed '$d')
        echo "${JSON:-(empty body)}"

        # An empty body HERE means even the old-syntax probe did not run, so the fault is
        # the host or the sync rather than a PHP version — said explicitly, because the
        # obvious reading of a 500 from this file is the one thing it cannot be.
        if [ "$STATUS" = "500" ] && [ -z "$JSON" ]; then
          echo "::error::preflight.php answered 500 with no body. It is deliberately"\
               "old-syntax PHP, so this is not a version problem — check that"\
               "api/config.php reached the host and that .htaccess is valid."
          exit 1
        fi

        # Three causes, and the body above distinguishes them rather than this message
        # picking one. An earlier version asserted "the config is stale", which was one
        # guess out of three and could not be checked from here.
        if [ "$STATUS" = "401" ]; then
          echo "::error::preflight.php refused the token. Read the JSON above:"\
               "tokenChars 0 = api/config.php did not reach the host or has no admin_token;"\
               "presentedChars 0 = this host forwards neither header to PHP;"\
               "both non-zero = the host's config really holds a different token."
          exit 1
        fi

        if [ "$STATUS" != "200" ]; then
          echo "::error::Host preflight failed ($STATUS). The site is deployed but the API"\
               "cannot run on this host; the body above says which requirement is unmet."
          exit 1
        fi

    # Apply pending migrations, by ASKING THE HOST.
    #
    # This runner cannot reach the database: MariaDB is bound to localhost on the web
    # host and port 3306 is not exposed (docs/database.md §3). So the deploy cannot run
    # DDL itself — it POSTs to the endpoint that can, which is why this step is after
    # the sync rather than before it. The new migration file has to be on the host
    # before we ask for it.
    #
    # ADMIN_TOKEN authenticates it. That makes the token load-bearing for deploys and
    # not only break-glass, which docs/deployment.md §3.1 now says.
    - name: 🗄️ Apply database migrations
      env:
        ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
      run: |
        if [ -z "$ADMIN_TOKEN" ]; then
          echo "::notice::ADMIN_TOKEN not set — skipping migrations. Set it to have the"\
               "deploy apply them (docs/database.md §5)."
          exit 0
        fi

        if [ "${{ github.ref_name }}" = "prod" ]; then
          ORIGIN="https://fonygames.guigui.fr"
        else
          ORIGIN="https://fonygames-dev.guigui.fr"
        fi

        # `-sS` so a transport failure prints something; the body is captured because the
        # failure detail — which file, which statement — is in it and is the whole point.
        BODY=$(curl -sS -X POST \
          -H "Authorization: Bearer $ADMIN_TOKEN" \
          -H "X-Admin-Token: $ADMIN_TOKEN" \
          -H 'X-Admin: 1' \
          -H 'Content-Type: application/json' \
          -d '{}' \
          -w '\n%{http_code}' \
          "$ORIGIN/api/index.php?a=migrate") || {
            echo "::error::Could not reach $ORIGIN to apply migrations."
            exit 1
          }

        STATUS=$(printf '%s' "$BODY" | tail -n1)
        JSON=$(printf '%s' "$BODY" | sed '$d')

        # `:-` rather than a bare echo: a blank line reads as a truncated log, and "the
        # endpoint answered nothing" is a finding in its own right — it means PHP died
        # before our code could reply.
        echo "${JSON:-(empty body)}"

        if [ "$STATUS" != "200" ]; then
          # A silent migration failure is worse than a red build: the site is already
          # live against a schema that does not match it.
          echo "::error::Migration endpoint answered $STATUS. The site is deployed but the"\
               "schema may not match it."
          exit 1
        fi

        # `ok` can be false inside a 200 only if the endpoint changes shape; check it
        # anyway rather than trusting the status alone.
        case "$JSON" in
          *'"ok":false'*)
            echo "::error::A migration failed. Nothing was rolled back — MariaDB commits"\
                 "DDL as it goes — and the file is not recorded as applied, so fix it and"\
                 "re-run this workflow."
            exit 1
            ;;
        esac

        case "$JSON" in
          *'"published":false'*)
            # Not fatal: the schema is correct and the flags default to active. But the
            # Worker is reading a stale or absent file, so it must not pass silently.
            echo "::warning::Migrations applied but flags.json could not be written — the"\
                 "Worker is failing open. Use the admin centre's republish."
            ;;
        esac

  # The room server (Cloudflare Durable Objects). Independent of the site
  # deploy: a Worker problem must not stop the hub from shipping, and vice
  # versa. Docs: docs/realtime-server.md
  worker-deploy:
    name: ☁️ Deploy room server
    runs-on: ubuntu-latest
    if: github.ref_name == 'dev' || github.ref_name == 'prod'
    environment: ${{ github.ref_name }}
    steps:
    - name: 🚚 Get latest code
      uses: actions/checkout@v6

    # This step used to warn-and-skip in every environment, and that is exactly how
    # production shipped for weeks with no room server: the secrets were never set,
    # `Publish` was skipped on every single run, and the deploy went green anyway.
    # Every game on prod failed with "Connection lost — reconnecting…" while CI said
    # success. A warning nobody reads is not a signal.
    #
    # So on `prod` a missing credential is now a FAILED deploy. `dev` keeps the
    # warning: it is the branch where a half-configured environment is a normal
    # state, and blocking it buys nothing.
    - name: 🔐 Check Cloudflare credentials
      id: creds
      #
      # The shell names match the SECRET names deliberately. They used to be
      # shortened to CF_API_TOKEN / CF_ACCOUNT_ID, and `CF_ACCOUNT_ID` is *also* a
      # real and different secret twenty lines up — it configures the admin centre's
      # analytics panel, not the deploy. One identifier meaning two things in two
      # jobs is a question waiting to be asked, so it is no longer abbreviated.
      env:
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      run: |
        if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
          echo "ready=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        echo "ready=false" >> "$GITHUB_OUTPUT"

        missing=""
        [ -n "$CLOUDFLARE_API_TOKEN" ]  || missing="$missing CLOUDFLARE_API_TOKEN"
        [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"

        if [ "${{ github.ref_name }}" = "prod" ]; then
          echo "::error::Missing in the 'prod' GitHub Environment:$missing — the room"\
               "server was NOT deployed, so every game on the site will fail to connect."\
               "Set them under Settings → Environments → prod (docs/deployment.md §6)."
          exit 1
        fi

        echo "::warning::Missing in the 'dev' GitHub Environment:$missing — skipping the"\
             "room server deploy. The site is up but no game can open a room."

    - name: 🟢 Set up Node
      if: steps.creds.outputs.ready == 'true'
      uses: actions/setup-node@v6
      with:
        node-version: 22
        cache: npm

    - name: 📦 Install
      if: steps.creds.outputs.ready == 'true'
      run: npm ci

    - name: 🧪 Typecheck worker
      if: steps.creds.outputs.ready == 'true'
      run: npx tsc --noEmit -p tsconfig.worker.json

    - name: ☁️ Publish
      if: steps.creds.outputs.ready == 'true'
      uses: cloudflare/wrangler-action@v3
      with:
        apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # --env selects the block in wrangler.jsonc, so `dev` and `prod` are
        # separate Workers with separate Durable Object namespaces.
        command: deploy --env ${{ github.ref_name }}

    # A published Worker is not the same thing as a reachable one: the workers.dev
    # route can be disabled per Worker, and the browser's only symptom for that is a
    # failed handshake the player reads as "Connection lost". Ask the Worker itself,
    # over the exact hostname the site is compiled to use.
    - name: 🩺 Room server answers
      if: steps.creds.outputs.ready == 'true'
      run: |
        # Read the hostname out of config.ts rather than repeating it here. That
        # file is the single place the browser's mapping lives, and a copy in this
        # workflow would keep passing against the old host on the day it changes —
        # checking the wrong server is worse than not checking one.
        if [ "${{ github.ref_name }}" = "prod" ]; then
          SITE="fonygames.guigui.fr"
        else
          SITE="fonygames-dev.guigui.fr"
        fi

        HOST=$(sed -n "s|.*'$SITE': *'wss://\([^']*\)'.*|\1|p" www/src/core/room/config.ts)
        if [ -z "$HOST" ]; then
          echo "::error::No room server mapped for $SITE in www/src/core/room/config.ts."\
               "The site would fall back to localhost and no game could connect."
          exit 1
        fi

        # A fresh deploy takes a moment to propagate, so this retries rather than
        # failing on the first miss.
        for attempt in 1 2 3 4 5; do
          STATUS=$(curl -fsS -o /tmp/health -w '%{http_code}' -m 15 "https://$HOST/health" || echo 000)
          [ "$STATUS" = "200" ] && break
          sleep 5
        done

        if [ "$STATUS" != "200" ]; then
          echo "::error::https://$HOST/health answered $STATUS. The Worker deployed but is"\
               "not reachable at the hostname www/src/core/room/config.ts maps this site to,"\
               "so every game will fail to connect. Check that the workers.dev route is"\
               "enabled for this Worker (docs/deployment.md §6)."
          exit 1
        fi

        echo "Room server healthy at https://$HOST/health — $(cat /tmp/health)"
