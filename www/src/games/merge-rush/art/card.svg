<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 90" width="120" height="90">
  <!--
    Double Fusion — hub card illustration.
    Style: docs/design/ui-guidelines.md §6 · mechanics: docs/design/illustrations.md

    A 4x4 board of numbered tiles, a few already merged into bigger ones. The
    colours are the game's own tileColor ramp at 2, 4, 8, 16 and 32, each with the
    number it stands for; the biggest tile carries the card's accent as an
    outline. Literal hexes: this loads through an img element with
    no access to the page's CSS. The numbers are text, as on the other cards;
    og.mjs draws them with whatever font resvg finds, so a share image built
    where it finds none shows the tiles without them.
  -->
  <rect x="17.5" y="2.5" width="19" height="19" rx="3" fill="#2CA2DD"/>
  <rect x="39.5" y="2.5" width="19" height="19" rx="3" fill="#2C3EDD"/>
  <rect x="61.5" y="2.5" width="19" height="19" rx="3" fill="#2A2F3D" fill-opacity="0.55"/>
  <rect x="83.5" y="2.5" width="19" height="19" rx="3" fill="#7F2CDD"/>
  <rect x="17.5" y="24.5" width="19" height="19" rx="3" fill="#2A2F3D" fill-opacity="0.55"/>
  <rect x="39.5" y="24.5" width="19" height="19" rx="3" fill="#2CA2DD"/>
  <rect x="61.5" y="24.5" width="19" height="19" rx="3" fill="#DD2CD7"/>
  <rect x="83.5" y="24.5" width="19" height="19" rx="3" fill="#2A2F3D" fill-opacity="0.55"/>
  <rect x="17.5" y="46.5" width="19" height="19" rx="3" fill="#2C3EDD"/>
  <rect x="39.5" y="46.5" width="19" height="19" rx="3" fill="#2A2F3D" fill-opacity="0.55"/>
  <rect x="61.5" y="46.5" width="19" height="19" rx="3" fill="#7F2CDD"/>
  <rect x="83.5" y="46.5" width="19" height="19" rx="3" fill="#2CA2DD"/>
  <rect x="17.5" y="68.5" width="19" height="19" rx="3" fill="#DD2C73" stroke="#F472B6" stroke-width="1.4"/>
  <rect x="39.5" y="68.5" width="19" height="19" rx="3" fill="#2CA2DD"/>
  <rect x="61.5" y="68.5" width="19" height="19" rx="3" fill="#2A2F3D" fill-opacity="0.55"/>
  <rect x="83.5" y="68.5" width="19" height="19" rx="3" fill="#2C3EDD"/>
  <g font-family="system-ui, sans-serif" font-size="9.5" font-weight="800" text-anchor="middle">
    <text x="27" y="15.4" fill="#FFFFFF">2</text>
    <text x="49" y="15.4" fill="#FFFFFF">4</text>
    <text x="93" y="15.4" fill="#FFFFFF">8</text>
    <text x="49" y="37.4" fill="#FFFFFF">2</text>
    <text x="71" y="37.4" fill="#FFFFFF">16</text>
    <text x="27" y="59.4" fill="#FFFFFF">4</text>
    <text x="71" y="59.4" fill="#FFFFFF">8</text>
    <text x="93" y="59.4" fill="#FFFFFF">2</text>
    <text x="27" y="81.4" fill="#FFFFFF">32</text>
    <text x="49" y="81.4" fill="#FFFFFF">2</text>
    <text x="93" y="81.4" fill="#FFFFFF">4</text>
  </g>
</svg>
