  <!--
    Tap Tap Revolution — hub card illustration.
    Style: docs/design/ui-guidelines.md §6 · mechanics: docs/design/illustrations.md

    A 10x10 grid of small hollow circles, most just an outline in the game's own
    accent, one lit solid orange mid-grid — the one circle a round ever lights at
    a time. Transparent background: the accent tint behind it is painted by CSS.

    Colours are literal hexes on purpose, same reasoning Neon Fall's card gives:
    this loads through an img element with no access to the page's CSS.
  -->
