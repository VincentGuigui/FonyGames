<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 112 112" width="112" height="112">
  <!--
    Goat Siege kid, design 2.

    A floppy-eared kid. Still hornless and beardless, so it cannot be mistaken for an
    adult at a glance.

    Square and centred on the drawing origin, so render.ts blits it with no offset
    arithmetic. Declares width, height AND viewBox because the sprite loader reads
    naturalWidth to know it decoded, and an SVG without an intrinsic size reports 0 or
    300 depending on the engine (docs/design/illustrations.md §4).

    Literal hexes, no currentColor: canvas draws this through an Image, which cannot
    see the page's CSS.
  -->
  <path d="M18 52 Q16 31.2 42 32 Q62 32.8 76 36 Q96 40 94 60 Q92 80 64 80.8 Q36 81.6 22 72 Q16 64 18 52 Z" fill="#e8e2d4"/>
  <!-- Underside in shade: kept low, wide and well inside the outline, or it
       reads as a belt. -->
  <ellipse cx="54" cy="76" rx="26.4" ry="5.2" fill="#c9c1ad"/>
  <g fill="#c9c1ad" opacity="0.85">
    <ellipse cx="34" cy="48" rx="10.4" ry="8"/>
    <ellipse cx="60" cy="62" rx="8" ry="6"/>
    <ellipse cx="48" cy="39.2" rx="6.4" ry="4.4"/>
  </g>
  <!-- Each foot lands OUTSIDE its hip, so the stance splays. Curled inwards,
       all four hooves met under the belly and the goat looked hobbled. -->
  <g fill="none" stroke-linecap="round">
    <path d="M40 74 Q40 92.8 28 100" stroke="#c9c1ad" stroke-width="5.1"/>
    <path d="M73.6 74 Q73.6 92.8 85.6 100" stroke="#c9c1ad" stroke-width="5.1"/>
    <path d="M32.8 74 Q32.8 92.8 20.8 100" stroke="#e8e2d4" stroke-width="6"/>
    <path d="M80 74 Q80 92.8 92 100" stroke="#e8e2d4" stroke-width="6"/>
  </g>
  <g fill="#8d8172">
    <circle cx="28" cy="100" r="3.3"/>
    <circle cx="85.6" cy="100" r="3.3"/>
    <circle cx="20.8" cy="100" r="3.3"/>
    <circle cx="92" cy="100" r="3.3"/>
  </g>
  <path d="M19.2 54 Q4 58 7.2 69.6" fill="none" stroke="#e8e2d4" stroke-width="5.2" stroke-linecap="round"/>
  <!-- Neck into head as one shape, so there is no seam. -->
  <path d="M74 38 Q90 34 92.8 22 L108 31.2 Q110 44 92 48 Z" fill="#e8e2d4"/>
  <!-- Muzzle: a snout to a blunt point, which is most of "goat". -->
  <ellipse cx="105.6" cy="35.2" rx="12" ry="8" transform="rotate(-20 105.6 35.2)" fill="#e8e2d4"/>
  <ellipse cx="88.8" cy="23.2" rx="8" ry="4" transform="rotate(40 88.8 23.2)" fill="#c9c1ad"/>
  <!-- Eye, and the nostril that stops the muzzle reading as a thumb. -->
  <circle cx="96.8" cy="29.6" r="3" fill="#10121a"/>
  <circle cx="110.4" cy="36" r="2" fill="#10121a"/>
</svg>
