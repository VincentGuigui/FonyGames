<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <!--
    Goat Siege cabbage.

    Ported from drawCabbage: five outer lobes, the head, and two veins curling out of
    the heart. Darker veins, not lighter — a light line on a light head disappears
    against the leaves behind it. The sitting shadow stays procedural, so this file
    is just the plant.

    Square and centred on the drawing origin, so render.ts blits it with no offset
    arithmetic. Declares width, height AND viewBox because the sprite loader reads
    naturalWidth to know it decoded, and an SVG without an intrinsic size reports 0 or
    300 depending on the engine (docs/design/illustrations.md §4).

    Literal hexes, no currentColor: canvas draws this through an Image, which cannot
    see the page's CSS.
  -->
  <g>
    <ellipse cx="54.15" cy="31.95" rx="24.8" ry="17.6" transform="rotate(-72.81 54.15 31.95)" fill="#2f9e5b"/>
    <ellipse cx="68.80" cy="47.76" rx="24.8" ry="17.6" transform="rotate(-0.81 68.80 47.76)" fill="#2f9e5b"/>
    <ellipse cx="54.71" cy="63.90" rx="24.8" ry="17.6" transform="rotate(71.19 54.71 63.90)" fill="#2f9e5b"/>
    <ellipse cx="31.35" cy="58.07" rx="24.8" ry="17.6" transform="rotate(143.19 31.35 58.07)" fill="#2f9e5b"/>
    <ellipse cx="31.00" cy="38.32" rx="24.8" ry="17.6" transform="rotate(215.19 31.00 38.32)" fill="#2f9e5b"/>
  </g>
  <ellipse cx="48" cy="45.6" rx="31.2" ry="28.8" fill="#4ADE80"/>
  <g>
    <path d="M48 61.6 Q28 52 36.8 31.2" fill="none" stroke="#1c6b3d" stroke-width="4.4" stroke-linecap="round"/>
    <path d="M48 61.6 Q68 52 59.2 31.2" fill="none" stroke="#1c6b3d" stroke-width="4.4" stroke-linecap="round"/>
  </g>
</svg>
