<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 90" width="120" height="90">
  <!--
    Goat Siege — hub card illustration.
    Style: docs/design/ui-guidelines.md §6 · mechanics: docs/design/illustrations.md

    Transparent: the accent tint behind it is painted by CSS, so it is both the
    placeholder before this file loads and the backdrop after.

    Colours are literal hexes on purpose. This is loaded through an img element,
    which is a separate document with no access to the page's CSS: a currentColor
    fill would render black on a dark card, and a CSS variable would make the shape
    vanish entirely.

    Note for editing by hand: an img-loaded SVG is parsed as strict XML, so a
    doubled hyphen inside a comment is illegal and silently kills the whole file.
  -->
  <!-- A goat sailing in over the fence towards a row of cabbages. The fence sits
       behind and the cabbages in front on the ground, so the depth reads. -->
  <g stroke="#4ADE80" stroke-width="4" stroke-linecap="round">
    <path d="M10 54 L110 54"/>
    <path d="M26 44 L26 60"/><path d="M60 44 L60 60"/><path d="M94 44 L94 60"/>
  </g>
  <!-- The same cabbage the board draws (render.ts drawCabbage, art/cabbage.svg):
       lobes, head, and two veins curling out of the heart. The card used to have its
       own accent-tinted version with a ring for the heart, so the hub promised one
       vegetable and the game delivered another. -->
  <g>
    <g transform="translate(22 72)"><ellipse cx="1.383" cy="-3.611" rx="5.580" ry="3.960" transform="rotate(-72.811)" fill="#2f9e5b"/><ellipse cx="4.680" cy="-0.054" rx="5.580" ry="3.960" transform="rotate(-0.811)" fill="#2f9e5b"/><ellipse cx="1.509" cy="3.578" rx="5.580" ry="3.960" transform="rotate(71.189)" fill="#2f9e5b"/><ellipse cx="-3.747" cy="2.265" rx="5.580" ry="3.960" transform="rotate(143.189)" fill="#2f9e5b"/><ellipse cx="-3.825" cy="-2.178" rx="5.580" ry="3.960" transform="rotate(215.189)" fill="#2f9e5b"/><ellipse cy="-0.540" rx="7.020" ry="6.480" fill="#4ADE80"/><path d="M0 3.060 Q-4.500 0.900 -2.520 -3.780" fill="none" stroke="#1c6b3d" stroke-width="1.000" stroke-linecap="round"/><path d="M0 3.060 Q4.500 0.900 2.520 -3.780" fill="none" stroke="#1c6b3d" stroke-width="1.000" stroke-linecap="round"/></g>
    <g transform="translate(45 74)"><ellipse cx="1.537" cy="-4.012" rx="6.200" ry="4.400" transform="rotate(-72.811)" fill="#2f9e5b"/><ellipse cx="5.199" cy="-0.059" rx="6.200" ry="4.400" transform="rotate(-0.811)" fill="#2f9e5b"/><ellipse cx="1.677" cy="3.976" rx="6.200" ry="4.400" transform="rotate(71.189)" fill="#2f9e5b"/><ellipse cx="-4.163" cy="2.517" rx="6.200" ry="4.400" transform="rotate(143.189)" fill="#2f9e5b"/><ellipse cx="-4.250" cy="-2.420" rx="6.200" ry="4.400" transform="rotate(215.189)" fill="#2f9e5b"/><ellipse cy="-0.600" rx="7.800" ry="7.200" fill="#4ADE80"/><path d="M0 3.400 Q-5.000 1.000 -2.800 -4.200" fill="none" stroke="#1c6b3d" stroke-width="1.100" stroke-linecap="round"/><path d="M0 3.400 Q5.000 1.000 2.800 -4.200" fill="none" stroke="#1c6b3d" stroke-width="1.100" stroke-linecap="round"/></g>
    <g transform="translate(68 72)"><ellipse cx="1.383" cy="-3.611" rx="5.580" ry="3.960" transform="rotate(-72.811)" fill="#2f9e5b"/><ellipse cx="4.680" cy="-0.054" rx="5.580" ry="3.960" transform="rotate(-0.811)" fill="#2f9e5b"/><ellipse cx="1.509" cy="3.578" rx="5.580" ry="3.960" transform="rotate(71.189)" fill="#2f9e5b"/><ellipse cx="-3.747" cy="2.265" rx="5.580" ry="3.960" transform="rotate(143.189)" fill="#2f9e5b"/><ellipse cx="-3.825" cy="-2.178" rx="5.580" ry="3.960" transform="rotate(215.189)" fill="#2f9e5b"/><ellipse cy="-0.540" rx="7.020" ry="6.480" fill="#4ADE80"/><path d="M0 3.060 Q-4.500 0.900 -2.520 -3.780" fill="none" stroke="#1c6b3d" stroke-width="1.000" stroke-linecap="round"/><path d="M0 3.060 Q4.500 0.900 2.520 -3.780" fill="none" stroke="#1c6b3d" stroke-width="1.000" stroke-linecap="round"/></g>
    <g transform="translate(91 74)"><ellipse cx="1.537" cy="-4.012" rx="6.200" ry="4.400" transform="rotate(-72.811)" fill="#2f9e5b"/><ellipse cx="5.199" cy="-0.059" rx="6.200" ry="4.400" transform="rotate(-0.811)" fill="#2f9e5b"/><ellipse cx="1.677" cy="3.976" rx="6.200" ry="4.400" transform="rotate(71.189)" fill="#2f9e5b"/><ellipse cx="-4.163" cy="2.517" rx="6.200" ry="4.400" transform="rotate(143.189)" fill="#2f9e5b"/><ellipse cx="-4.250" cy="-2.420" rx="6.200" ry="4.400" transform="rotate(215.189)" fill="#2f9e5b"/><ellipse cy="-0.600" rx="7.800" ry="7.200" fill="#4ADE80"/><path d="M0 3.400 Q-5.000 1.000 -2.800 -4.200" fill="none" stroke="#1c6b3d" stroke-width="1.100" stroke-linecap="round"/><path d="M0 3.400 Q5.000 1.000 2.800 -4.200" fill="none" stroke="#1c6b3d" stroke-width="1.100" stroke-linecap="round"/></g>
  </g>
  <!-- Goat in side profile as one bold silhouette rather than stick lines: at
       160 px a stroked skeleton reads as a spider. -->
  <g fill="#4ADE80">
    <!-- Legs, tucked as if mid-jump. -->
    <rect x="30" y="30" width="5" height="12" rx="2.5"/>
    <rect x="39" y="32" width="5" height="11" rx="2.5"/>
    <rect x="49" y="31" width="5" height="12" rx="2.5"/>
    <rect x="57" y="30" width="5" height="11" rx="2.5"/>
    <ellipse cx="45" cy="24" rx="19" ry="10"/>
    <!-- Tail. -->
    <path d="M27 18 L20 10 L28 22 Z"/>
    <!-- Neck and head. -->
    <path d="M56 20 L66 12 L72 18 L62 26 Z"/>
    <ellipse cx="70" cy="15" rx="9" ry="6.5"/>
    <!-- Beard: the one shape that says goat and not sheep. -->
    <path d="M70 20 L67 30 L74 21 Z"/>
  </g>
  <!-- Horns sweep back over the neck. -->
  <g fill="none" stroke="#4ADE80" stroke-width="3.5" stroke-linecap="round">
    <path d="M67 9 Q62 2 55 4"/><path d="M74 9 Q70 1 62 2"/>
  </g>
  <circle cx="74" cy="13" r="2" fill="#10121a"/>
</svg>
