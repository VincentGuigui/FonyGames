  <ellipse cx="56" cy="68" rx="22" ry="4.4" fill="#c9c1ad"/>
  <g fill="none" stroke-linecap="round">
    <path d="M80 62 Q96 68 108 62" stroke="#c9c1ad" stroke-width="5"/>
    <path d="M34 66 Q18 72 6 66" stroke="#c9c1ad" stroke-width="5"/>
    <path d="M78 68 Q94 76 106 72" stroke="#e8e2d4" stroke-width="5.8"/>
    <path d="M36 70 Q20 80 8 78" stroke="#e8e2d4" stroke-width="5.8"/>
  </g>
  <g fill="#8d8172"><circle cx="108" cy="62" r="3"/><circle cx="6" cy="66" r="3"/><circle cx="106" cy="72" r="3"/><circle cx="8" cy="78" r="3"/></g>
  <path d="M82 40 Q94 30 94 18 L107 24 Q110 38 90 44 Z" fill="#e8e2d4"/>
