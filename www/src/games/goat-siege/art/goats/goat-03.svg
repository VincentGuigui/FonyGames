<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 112 112" width="112" height="112">
  <!--
    Goat Siege adult goat, design 3: the leaper.

    Airborne, with an arched back and legs stretched fore and aft, because in this game a
    goat spends its whole life being lobbed over a fence. Nothing touches the ground,
    which is the honest picture of what is happening to it.

    Widest of the three nose to tail and the shallowest, so it reads as motion even in a
    still frame.

    Same conventions as goat-01: square box centred on the origin, intrinsic width and
    height, literal hexes only.
  -->
