<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 112 112" width="112" height="112">
  <!--
    Goat Siege adult goat, design 2: the shaggy one.

    A scalloped fleece line along the underside does all the work, so this reads as a
    different animal from goat-01 at a glance rather than on inspection. Broad, low and
    stubby horned. The hooves peek out of the fleece rather than standing on legs.

    Square and centred on the drawing origin, so render.ts blits it with no offset
    arithmetic. Declares width, height AND viewBox because the sprite loader reads
    naturalWidth to know it decoded (docs/design/illustrations.md).

    Literal hexes only, never currentColor: canvas draws this through an Image, which
    cannot see the page's CSS.
  -->
  <path d="M16 52 Q14 30 44 30 Q72 30 90 40 Q100 46 98 58 Q94 70 88 62 Q84 74 77 66 Q73 78 66 68 Q62 80 55 70 Q51 82 44 71 Q40 82 33 70 Q27 80 22 67 Q16 62 16 52 Z" fill="#e8e2d4"/>
  <path d="M22 46 Q40 40 60 42 Q78 44 92 50" fill="none" stroke="#c9c1ad" stroke-width="3.4" stroke-linecap="round"/>
  <g fill="#8d8172"><circle cx="34" cy="80" r="3.4"/><circle cx="58" cy="82" r="3.4"/><circle cx="76" cy="78" r="3.4"/></g>
  <path d="M84 40 Q98 36 100 24 L112 32 Q112 46 94 48 Z" fill="#e8e2d4"/>
  <ellipse cx="107" cy="36" rx="9" ry="6.4" transform="rotate(-18 107 36)" fill="#e8e2d4"/>
  <g fill="none" stroke="#8d8172" stroke-width="5.6" stroke-linecap="round">
    <path d="M101 22 Q96 12 86 14"/>
    <path d="M99 24 Q98 14 90 10"/>
  </g>
  <path d="M100 44 Q98 60 91 64 Q96 52 95 43 Z" fill="#e8e2d4"/>
  <circle cx="99" cy="30" r="2.8" fill="#10121a"/>
</svg>
