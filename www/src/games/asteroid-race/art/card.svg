<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 90" width="120" height="90">
  <!--
    Asteroid Race — hub card illustration.
    Style: docs/design/ui-guidelines.md §6 · mechanics: docs/design/illustrations.md

    The game in one glance: a ship low in frame, seen from behind, threading a
    corridor of grey rocks that fade into black, with the tube's guide rings
    receding to a vanishing point.

    Transparent background: the accent tint behind it is painted by CSS, so it
    is both the placeholder before this file loads and the backdrop after.

    Colours are literal hexes on purpose — an img-loaded SVG has no access to
    the page's CSS, so currentColor would render black and a CSS variable would
    make the shape vanish.
  -->
  <g fill="none" stroke-linejoin="round" stroke-linecap="round">
    <!-- the tube, receding -->
    <ellipse cx="60" cy="34" rx="7" ry="5" stroke="#334155" stroke-width="1"/>
    <ellipse cx="60" cy="34" rx="18" ry="13" stroke="#334155" stroke-width="1"/>
    <ellipse cx="60" cy="34" rx="34" ry="24" stroke="#3F4E63" stroke-width="1.2"/>
    <ellipse cx="60" cy="34" rx="56" ry="40" stroke="#475569" stroke-width="1.4"/>

    <!-- far rocks, nearly gone into the black -->
    <path d="M52 30 L56 28 L58 31 L55 34 L51 33 Z" fill="#475569"/>
    <path d="M68 37 L72 36 L73 39 L70 41 L67 40 Z" fill="#3F4E63"/>

    <!-- a mid-distance small rock -->
    <path d="M83 26 L90 23 L95 27 L93 34 L86 35 L81 31 Z" fill="#9CA3AF"/>

    <!-- the near large rock, the one that splits -->
    <path d="M24 40 L36 33 L48 39 L47 53 L34 59 L22 52 Z" fill="#4B5563" stroke="#94A3B8" stroke-width="1.5"/>

    <!-- the ship, low and centre, seen from behind -->
    <path d="M60 62 L78 74 L71 77 L60 71 L49 77 L42 74 Z" fill="#334155" stroke="#64748B" stroke-width="1.6"/>
    <path d="M60 58 L66 72 L60 76 L54 72 Z" fill="#94A3B8" stroke="#CBD5E1" stroke-width="1.6"/>
    <path d="M60 62 L63 69 L60 71 L57 69 Z" fill="#A3E635"/>
    <ellipse cx="55" cy="75" rx="3" ry="2" fill="#FDE047"/>
    <ellipse cx="65" cy="75" rx="3" ry="2" fill="#FDE047"/>

    <!-- the crosshair, dead ahead -->
    <path d="M56 30 L53 27 M64 30 L67 27 M56 38 L53 41 M64 38 L67 41" stroke="#A3E635" stroke-width="1.6"/>
  </g>
</svg>
