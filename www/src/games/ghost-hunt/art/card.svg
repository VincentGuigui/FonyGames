<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 90" width="120" height="90">
  <!--
    Ghost Hunt — hub card illustration.
    Spec: docs/specs/games/ghost-hunt.md §4
    Style: docs/design/ui-guidelines.md §6 · mechanics: docs/design/illustrations.md

    A phone held up, its screen a bright ring cut out of the dark with an edge
    traced shape inside it. Replaces the old Compass Hunt needle, which promised a
    sensor this game deliberately never reads.

    The ring is the whole interface, so it is the whole illustration: outside it,
    the room; inside it, outlines and a ghost. The wireframe is drawn as strokes
    rather than fills so it reads as a trace at 120px, which is the size that
    matters.

    Transparent: the accent tint behind it is painted by CSS, so it is both the
    placeholder before this file loads and the backdrop after.

    Colours are literal hexes on purpose. This is loaded through an img element,
    which is a separate document with no access to the page's CSS: a currentColor
    fill would render black on a dark card, and a CSS variable would make the shape
    vanish entirely.

    Note for editing by hand: an img-loaded SVG is parsed as strict XML, so a
    doubled hyphen inside a comment is illegal and silently kills the whole file.
  -->

  <!-- The phone, held up. Outline only, so the ring is what carries the weight. -->
  <rect x="34" y="8" width="52" height="74" rx="7" fill="none" stroke="#34D399"
        stroke-width="2.5" opacity="0.55"/>

  <!-- The dark screen the ring is cut out of. -->
  <rect x="38" y="14" width="44" height="62" rx="4" fill="#0B0F16"/>

  <!-- The detector ring itself. -->
  <circle cx="60" cy="45" r="18" fill="#05070B" stroke="#34D399" stroke-width="3"/>

  <!-- Behind it: the room as a wireframe, all edges and no substance. Kept to the
       edge of the ring and dim, so it reads as structure the ghost is standing in
       rather than as an object of its own. -->
  <g stroke="#D1FAE5" stroke-width="1.2" fill="none" stroke-linecap="round" opacity="0.45">
    <path d="M45 33 L49 37 L49 57"/>
    <path d="M75 33 L71 37 L71 57"/>
    <path d="M45 57 L75 57"/>
    <path d="M49 37 L71 37"/>
  </g>

  <!-- And the ghost, traced the same way: dome above, wavy hem below. -->
  <path d="M52 55 L52 45 Q52 36 60 36 Q68 36 68 45 L68 55
           L65.3 51.5 L62.7 55 L60 51.5 L57.3 55 L54.7 51.5 Z"
        fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linejoin="round"/>
  <circle cx="56.6" cy="45" r="1.5" fill="#FFFFFF"/>
  <circle cx="63.4" cy="45" r="1.5" fill="#FFFFFF"/>

  <!-- The glow that says you are close. -->
  <circle cx="60" cy="45" r="23" fill="none" stroke="#34D399" stroke-width="1.5"
          opacity="0.35"/>
</svg>
