<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 90" width="120" height="90">
  <!--
    Abduct-Moo — hub card illustration.
    Spec: docs/specs/games/abduct-moo.md
    Style: docs/design/ui-guidelines.md §6 · mechanics: docs/design/illustrations.md

    A UFO's light cone over a barn, one cow mid-abduction — the whole pitch in
    one frame (spec header table).

    Transparent: the accent tint behind it is painted by CSS, so it is both the
    placeholder before this file loads and the backdrop after.

    Colours are literal hexes on purpose. This is loaded through an img element,
    which is a separate document with no access to the page's CSS: a currentColor
    fill would render black on a dark card, and a CSS variable would make the shape
    vanish entirely.
  -->

  <!-- A few stars, night countryside. -->
  <g fill="#FFFFFF" opacity="0.5">
    <circle cx="12" cy="10" r="1"/>
    <circle cx="26" cy="6" r="0.8"/>
    <circle cx="104" cy="8" r="1"/>
    <circle cx="112" cy="20" r="0.8"/>
    <circle cx="8" cy="28" r="0.8"/>
  </g>

  <!-- The UFO. -->
  <ellipse cx="76" cy="20" rx="18" ry="5" fill="#94A3B8" stroke="#E2E8F0" stroke-width="1"/>
  <path d="M64 19 Q64 10 76 10 Q88 10 88 19 Q82 15 76 15 Q70 15 64 19 Z"
        fill="#A7F3D0" stroke="#FACC15" stroke-width="1"/>

  <!-- The light cone, reaching down to the barn. -->
  <path d="M68 23 L52 68 L100 68 L84 23 Z" fill="#FDE68A" opacity="0.4"/>

  <!-- The barn. -->
  <path d="M40 58 L60 42 L80 58 L74 58 L60 47 L46 58 Z" fill="#7C2D12" stroke="#450A0A" stroke-width="1.4"/>
  <rect x="44" y="56" width="32" height="24" fill="#DC2626" stroke="#7F1D1D" stroke-width="1.6"/>
  <path d="M56 80 L56 66 Q60 61 64 66 L64 80 Z" fill="#450A0A"/>

  <!-- The cow, mid-abduction, lifted between barn and cone. -->
  <g transform="translate(60 40) rotate(-8)">
    <ellipse cx="0" cy="0" rx="9" ry="5.5" fill="#FFFFFF" stroke="#3F3F46" stroke-width="1.4"/>
    <ellipse cx="-3" cy="-1.5" rx="2.2" ry="2.6" fill="#3F3F46"/>
    <circle cx="6" cy="-1" r="3.4" fill="#FFFFFF" stroke="#3F3F46" stroke-width="1.2"/>
  </g>

  <!-- Ground fields either side. -->
  <path d="M0 80 Q30 74 40 80 L40 90 L0 90 Z" fill="#166534" opacity="0.6"/>
  <path d="M80 80 Q100 74 120 80 L120 90 L80 90 Z" fill="#166534" opacity="0.6"/>
</svg>
