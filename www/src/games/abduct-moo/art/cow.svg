<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 64" width="80" height="64">
  <!--
    Abduct-Moo — one cow, reused for every player. Spec: docs/specs/games/abduct-moo.md §4

    Loaded through an img element (Squash Mosquitoes' own art/mosquito.svg
    precedent), one sprite for everyone: which cow is YOURS is drawn entirely
    in CSS on this element (a `filter: brightness()` dim for everyone else,
    plus a ring on a wrapping element for a second, non-brightness cue —
    spec §11) — nothing here changes between players.

    Colours are literal hexes for the same reason art/card.svg states in full:
    an img-loaded SVG has no access to the page's CSS, so currentColor renders
    black and a CSS variable renders nothing at all.
  -->

  <!-- Legs. -->
  <g fill="#3F3F46">
    <rect x="18" y="46" width="8" height="14" rx="2"/>
    <rect x="54" y="46" width="8" height="14" rx="2"/>
  </g>

  <!-- Body. -->
  <ellipse cx="40" cy="38" rx="30" ry="18" fill="#FFFFFF" stroke="#3F3F46" stroke-width="2.5"/>

  <!-- Patches. -->
  <g fill="#3F3F46">
    <ellipse cx="24" cy="30" rx="7" ry="8"/>
    <ellipse cx="54" cy="42" rx="9" ry="7"/>
  </g>

  <!-- Head. -->
  <ellipse cx="66" cy="26" rx="14" ry="12" fill="#FFFFFF" stroke="#3F3F46" stroke-width="2.5"/>
  <!-- Snout. -->
  <ellipse cx="74" cy="31" rx="7" ry="5.5" fill="#FBCFE8" stroke="#3F3F46" stroke-width="2"/>
  <g fill="#3F3F46">
    <circle cx="72" cy="30" r="1"/>
    <circle cx="77" cy="30" r="1"/>
  </g>
  <!-- Eye. -->
  <circle cx="64" cy="21" r="2" fill="#3F3F46"/>
  <!-- Ears. -->
  <g fill="#FBCFE8" stroke="#3F3F46" stroke-width="2">
    <ellipse cx="56" cy="16" rx="4" ry="6" transform="rotate(-30 56 16)"/>
    <ellipse cx="72" cy="14" rx="4" ry="6" transform="rotate(20 72 14)"/>
  </g>
  <!-- Horns. -->
  <g fill="none" stroke="#E7E5E4" stroke-width="2.5" stroke-linecap="round">
    <path d="M58 10 Q56 4 61 3"/>
    <path d="M68 8 Q70 2 75 3"/>
  </g>
</svg>
