<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 90" width="120" height="90">
  <!--
    Sling Puck — hub card illustration.
    Style: docs/design/ui-guidelines.md §6 · mechanics: docs/design/illustrations.md

    Transparent: the accent tint behind it is painted by CSS, so it is both the
    placeholder before this file loads and the backdrop after.

    Colours are literal hexes on purpose. This is loaded through an img element,
    which is a separate document with no access to the page's CSS: a currentColor
    fill would render black on a dark card, and a CSS variable would make the shape
    vanish entirely.

    Note for editing by hand: an img-loaded SVG is parsed as strict XML, so a
    doubled hyphen inside a comment is illegal and silently kills the whole file.
  -->
  <!-- A bank shot in progress, drawn from your seat. To the maintainer's sketch.

       Only ONE half is drawn, and that is the point every previous version missed:
       you can only ever see your own half of the board (spec §4). Two halves stacked
       with a rail between them was a picture of the rules rather than of the game, and
       it read as one object split down the middle.

       So: your board, open at the top where the gap is, running off the bottom of the
       frame because it continues into your lap. The puck is squashed against the side
       wall mid-bounce, with its trail behind it — the shot is a BANK, which is how the
       game is actually played and what the straight-up-the-middle versions could never
       show. Where it goes next is off the wall and out through the gap, and leaving
       that to the viewer is what makes it a moment instead of a diagram.
  -->
  <!-- The board: an open path, not a rect, because the gap at the top has to be a real
       break in the outline. Clockwise from the left of the gap round to its right, and
       bleeding past the bottom edge on purpose.

       Wider than the sketch, which was drawn portrait on a phone. In a 120x90 frame a
       portrait board reads as a doorway; widened, it reads as a board you are looking
       across, which is also what you actually see from your seat. -->
  <path d="M50 9 L24 9 Q16 9 16 17 L16 98 M104 98 L104 17 Q104 9 96 9 L70 9"
        fill="none" stroke="#FB7185" stroke-width="4.5"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- The puck, pressed against the right wall. Taller than it is wide, because hitting
       the wall squashes it across — that is the whole reason to draw it here rather than
       in open space, where a circle says nothing about what is happening to it. -->
  <ellipse cx="97" cy="47" rx="7" ry="9.5" fill="none" stroke="#FB7185" stroke-width="4"/>
  <circle cx="97" cy="47" r="2" fill="#FB7185"/>

  <!-- The trail, three strokes climbing from the band to the wall. Separate strokes
       rather than a dashed line: a dash pattern spaces itself evenly and reads as a
       border, while three deliberate marks read as speed. -->
  <g stroke="#FB7185" stroke-width="4" stroke-linecap="round">
    <path d="M85 60 L90 55"/>
    <path d="M74 68 L80 63"/>
    <path d="M63 75 L69 71"/>
  </g>

  <!-- The band, pulled back into a shallow V, and its two chunky posts. Pulled rather
       than released this time: the sketch has it loaded, and with the puck already out on
       the wall there is no chevron confusion left to avoid. -->
  <g fill="#FB7185">
    <circle cx="28" cy="72" r="5"/><circle cx="92" cy="72" r="5"/>
  </g>
  <path d="M28 72 L60 84 L92 72" fill="none" stroke="#FB7185" stroke-width="4"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
