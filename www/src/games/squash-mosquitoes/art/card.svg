<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 90" role="img" aria-label="A purple mosquito silhouette crossed out inside a red no-entry circle">
  <!--
    Squash Mosquitoes. Contract: docs/design/illustrations.md
    A "no mosquitoes" prohibition sign: the purple mosquito (the game's own accent,
    #8a6dc9) crossed out in red, the way a real no-entry sign reads at a glance.
    Authored at 500x500 and fit to the 120x90 card by one scale + centre transform.
  -->
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <g transform="translate(15, 0) scale(0.18)">
    <!-- The mosquito, flat purple. -->
    <g id="mosquito-clipart" fill="#8a6dc9">
      <path d="M 170 270 Q 120 220 90 270 T 60 390" fill="none" stroke="#8a6dc9" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M 200 275 Q 160 250 130 310 T 110 400" fill="none" stroke="#8a6dc9" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M 240 280 Q 220 280 190 330 T 170 405" fill="none" stroke="#8a6dc9" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />

      <path d="M 210 260 C 150 270 80 300 70 340 C 60 370 90 380 130 360 C 180 335 220 295 240 280 Z" />

      <path d="M 180 230 C 140 140 90 150 100 220 C 110 270 160 250 180 230 Z" opacity="0.6" />

      <path d="M 210 240 C 200 275 240 295 270 275 C 290 260 280 235 245 235 Z" />

      <path d="M 220 230 C 250 120 180 100 150 200 C 140 250 200 250 220 230 Z" opacity="0.8" />

      <path d="M 230 280 Q 250 330 260 360 T 275 405" fill="none" stroke="#8a6dc9" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M 255 280 Q 290 320 310 360 T 330 400" fill="none" stroke="#8a6dc9" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M 275 270 Q 330 290 350 340 T 375 390" fill="none" stroke="#5a3d99" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />

      <circle cx="285" cy="225" r="48" />

      <!-- Eye: a white cutout in the purple, clipart-style. -->
      <ellipse cx="300" cy="212" rx="16" ry="22" fill="#ffffff" transform="rotate(5, 300, 212)" />
      <ellipse cx="303" cy="212" rx="8" ry="12" fill="#5a3d99" transform="rotate(5, 303, 212)" />
      <circle cx="299" cy="206" r="4" fill="#ffffff" />

      <path d="M 270 180 C 260 140 235 125 215 135" fill="none" stroke="#8a6dc9" stroke-width="7" stroke-linecap="round" />
      <path d="M 290 180 C 295 130 275 110 255 115" fill="none" stroke="#8a6dc9" stroke-width="7" stroke-linecap="round" />

      <path d="M 320 230 C 360 240 390 260 410 280 C 413 283 408 288 404 285 C 380 270 350 252 315 245 Z" />
      <circle cx="410" cy="283" r="8" />
    </g>

    <!-- The no-entry ring, on top. -->
    <g id="prohibition-symbol" filter="url(#shadow)">
      <circle cx="250" cy="250" r="190" fill="none" stroke="#d62828" stroke-width="36" />
      <line x1="115" y1="115" x2="385" y2="385" stroke="#d62828" stroke-width="36" stroke-linecap="round" />
    </g>
  </g>
</svg>
