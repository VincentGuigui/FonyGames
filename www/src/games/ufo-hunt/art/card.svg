<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 90" width="120" height="90">
  <!--
    UFO Hunt — hub card illustration.
    Spec: docs/specs/games/ufo-hunt.md §4
    Style: docs/design/ui-guidelines.md §6 · mechanics: docs/design/illustrations.md

    Ghost Hunt's own card swapped for what this game actually is: a saucer hangs in
    the night sky, a fixed crosshair ringed round it, and a scatter of laser bolts
    converge on it from below — everyone's own shot, one shared target.

    Transparent: the accent tint behind it is painted by CSS, so it is both the
    placeholder before this file loads and the backdrop after.

    Colours are literal hexes on purpose. This is loaded through an img element,
    which is a separate document with no access to the page's CSS: a currentColor
    fill would render black on a dark card, and a CSS variable would make the shape
    vanish entirely.

    Note for editing by hand: an img-loaded SVG is parsed as strict XML, so a
    doubled hyphen inside a comment is illegal and silently kills the whole file.
  -->

  <!-- A few stars, so the saucer reads as sky rather than empty space. -->
  <g fill="#FFFFFF" opacity="0.5">
    <circle cx="14" cy="14" r="1"/>
    <circle cx="30" cy="8" r="0.8"/>
    <circle cx="100" cy="12" r="1"/>
    <circle cx="110" cy="30" r="0.8"/>
    <circle cx="16" cy="60" r="0.8"/>
    <circle cx="10" cy="76" r="1"/>
  </g>

  <!-- Laser bolts, converging on the saucer from three phones below. -->
  <g stroke="#5EEAD4" stroke-width="1.6" stroke-linecap="round" opacity="0.6">
    <path d="M18 82 L54 46"/>
    <path d="M60 86 L60 50"/>
    <path d="M102 82 L66 46"/>
  </g>

  <!-- The crosshair: fixed on screen, the saucer moves under it. -->
  <g stroke="#5EEAD4" stroke-width="1.2" opacity="0.75">
    <circle cx="60" cy="42" r="21" fill="none"/>
    <path d="M60 17 L60 25" stroke-linecap="round"/>
    <path d="M60 59 L60 67" stroke-linecap="round"/>
    <path d="M35 42 L43 42" stroke-linecap="round"/>
    <path d="M77 42 L85 42" stroke-linecap="round"/>
  </g>

  <!-- The saucer: disc, dome, a ring of lights. -->
  <ellipse cx="60" cy="45" rx="20" ry="6" fill="#94A3B8" stroke="#E2E8F0" stroke-width="1"/>
  <path d="M46 43 Q46 28 60 28 Q74 28 74 43 Q67 39 60 39 Q53 39 46 43 Z"
        fill="#A7F3D0" stroke="#5EEAD4" stroke-width="1.2"/>
  <g fill="#5EEAD4">
    <circle cx="46" cy="45" r="1.6"/>
    <circle cx="53" cy="47.5" r="1.6"/>
    <circle cx="60" cy="48.5" r="1.6"/>
    <circle cx="67" cy="47.5" r="1.6"/>
    <circle cx="74" cy="45" r="1.6"/>
  </g>

  <!-- A soft glow under the disc — the same "you are close" language Ghost Hunt's ring used. -->
  <ellipse cx="60" cy="45" rx="26" ry="9" fill="none" stroke="#5EEAD4" stroke-width="1" opacity="0.3"/>
</svg>
