<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" width="200" height="200">
  <title>A rhino sitting in a box, facing you</title>
  <!-- Literal hexes, no currentColor and no CSS variable: this is loaded
       through an img, where both render as nothing (illustrations.md). The
       eye whites are left empty on purpose. The pupils are DOM elements laid
       over them, because they move sixty times a second and an img cannot be
       animated from the outside. Their centres are at 38% and 62% across,
       44% down, which is what rhino-spin.css positions them from. -->

  <!-- The box, drawn behind the rhino so it sits in it. -->
  <path d="M26 118 L174 118 L182 190 L18 190 Z" fill="#8C6239"/>
  <path d="M26 118 L174 118 L170 132 L30 132 Z" fill="#A9784A"/>

  <!-- Head and body: one rounded mass, the way a rhino reads at this size. -->
  <path d="M100 26 C142 26 166 54 166 92 C166 122 140 142 100 142 C60 142 34 122 34 92 C34 54 58 26 100 26 Z" fill="#9AA3AD"/>
  <!-- Muzzle. -->
  <ellipse cx="100" cy="116" rx="34" ry="24" fill="#B4BCC5"/>
  <!-- The horn, the one shape that makes it a rhino and not a hippo. -->
  <path d="M100 66 L110 106 L90 106 Z" fill="#E4E7EB"/>
  <path d="M100 96 L106 118 L94 118 Z" fill="#E4E7EB"/>
  <!-- Nostrils. -->
  <ellipse cx="88" cy="126" rx="4" ry="3" fill="#6B7480"/>
  <ellipse cx="112" cy="126" rx="4" ry="3" fill="#6B7480"/>
  <!-- Ears. -->
  <ellipse cx="46" cy="44" rx="13" ry="18" fill="#9AA3AD" transform="rotate(-24 46 44)"/>
  <ellipse cx="154" cy="44" rx="13" ry="18" fill="#9AA3AD" transform="rotate(24 154 44)"/>

  <!-- Eye whites. The pupils are not here. -->
  <circle cx="76" cy="88" r="16" fill="#FDFDFB"/>
  <circle cx="124" cy="88" r="16" fill="#FDFDFB"/>

  <!-- Front feet over the box rim, so it reads as sitting in rather than behind. -->
  <ellipse cx="62" cy="122" rx="14" ry="9" fill="#8A929B"/>
  <ellipse cx="138" cy="122" rx="14" ry="9" fill="#8A929B"/>
</svg>
