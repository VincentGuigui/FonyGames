<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" data-outline="6.2">
  <!--
    Cat and Mouse: a mouse, filled.

    Sitting up on its haunches, two big ears, tail curling behind. Vertical, so it can
    never be taken for the cat's horizontal mass, and four shapes none of which overlaps
    another.

    The ears are **pointed leaves, not circles**, and that is a consequence of the hollow
    variant rather than a taste. A stroked circle is a ring, so round ears hollowed into
    two rings that read as goggle eyes and the whole mouse became a face. A stroked leaf
    is still a leaf. Anything drawn here has to survive being outlined.

    That last point is not tidiness. mouse-hollow.svg is GENERATED from this file by
    www/src/games/outlines.mjs, which turns every solid fill into a stroke of the same
    colour. Overlapping fills hollow into a tangle of rings; separate shapes stay
    legible. Redraw here only, then run "npm run art:outlines".

    The tail is already a stroke, so the generator leaves it exactly as it is in both
    versions.

    It fills less of its box than the drawing it replaced (66 per cent wide against 74),
    so MOUSE_SPAN in render.ts was raised to keep the mouse the same size on screen.

    The rings are NOT here. The grace ring turns on a clock and the own-icon ring depends
    on who is looking, so both are state driven and stay procedural.
  -->
  <path d="M62 76 Q82 82 84 66" fill="none" stroke="#f4f1e8" stroke-width="4" stroke-linecap="round"/>
  <path d="M30 82 Q26 50 40 38 Q52 28 62 38 Q76 50 70 82 Z" fill="#f4f1e8"/>
  <path d="M40 38 Q27 31 27 13 Q42 19 47 33 Z" fill="#f4f1e8"/>
  <path d="M56 37 Q69 29 71 12 Q56 18 51 32 Z" fill="#f4f1e8"/>
</svg>
