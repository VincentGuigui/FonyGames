<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 136 136" width="136" height="136">
  <!--
    Cat and Mouse: the cat. Always filled, on every screen (spec section 7).

    Upright and sitting, with tall thin ears, whiskers and an S tail. The ears and the
    whiskers are the tell: at icon size a cat and a mouse are both a blob, so the
    silhouette has to carry it, and this profile survives being small on a cheap screen.

    It fills more of its box than the drawing it replaced (76 per cent wide against 71),
    so CAT_SPAN in render.ts was reduced to keep the cat the same size on screen. The
    drawn size has to stay honest against CM_CATCH_RADIUS or players misjudge the reach.

    The eyes are painted in the floor's own colour rather than cut out, so the cat is
    looking at you instead of being a purple lozenge. That ties this file to the floor
    colour in render.ts, and both say so.
  -->
  <path d="M46 44 L44 8 L62 36 Z" fill="#C084FC"/>
  <path d="M92 44 L94 8 L76 36 Z" fill="#C084FC"/>
  <path d="M44 106 Q38 70 54 54 Q68 42 84 54 Q100 70 94 106 Z" fill="#C084FC"/>
  <ellipse cx="69" cy="52" rx="26" ry="22" fill="#C084FC"/>
  <path d="M94 96 Q120 96 118 74 Q116 58 100 58" fill="none" stroke="#C084FC" stroke-width="9" stroke-linecap="round"/>
  <g fill="#151622"><circle cx="58" cy="48" r="3.6"/><circle cx="80" cy="48" r="3.6"/></g>
  <g fill="none" stroke="#C084FC" stroke-width="2.6" stroke-linecap="round">
    <path d="M44 58 L22 54"/><path d="M44 62 L23 64"/>
    <path d="M94 58 L116 54"/><path d="M94 62 L115 64"/>
  </g>
</svg>
